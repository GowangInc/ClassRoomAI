<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="A self-hosted workspace for teacher-guided AI learning.">
  <title>ClassRoomAI — Spaces</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/math.js" defer></script>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <aside id="app-sidebar" class="app-sidebar" aria-label="Workspace">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">C</span>ClassRoomAI</a>
    <nav id="navigation" class="nav" aria-label="Main navigation"></nav>
    <p class="sidebar-note">Your prompts. Your providers.<br>Teacher-guided learning.</p>
  </aside>
  <div class="app-content">
    <header id="app-header" class="app-header">
      <button id="sidebar-toggle" type="button" class="icon-button" aria-label="Toggle navigation" aria-controls="app-sidebar" aria-expanded="true">☰</button>
      <span id="page-label">Spaces</span>
      <a class="button primary small header-create" href="#/teacher/new">Create a Space</a>
    </header>
    <div id="notifications" class="notifications" role="status" aria-live="polite"></div>
    <div id="errors" class="error global-error" role="alert" hidden></div>
    <main id="main" class="shell" tabindex="-1"><p class="empty">Opening your workspace…</p></main>
    <footer class="footer"><span>ClassRoomAI · Self-hosted Spaces</span><span>AI can make mistakes. Teachers guide the learning.</span></footer>
  </div>
  <noscript><p>This application requires JavaScript. Enable it to join a classroom or manage spaces.</p></noscript>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
</body>
</html>
